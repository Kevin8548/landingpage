name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Slack
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_BUILDS }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ needs.build.result == 'success' && needs.deploy.result == 'success' && '✅' || '❌' }} *${{ github.repository }}* (${{ github.ref_name }})\nBuild: ${{ needs.build.result }} | Deploy: ${{ needs.deploy.result }}\nPor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución>"

  notion-hu:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar historias en Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DATABASE_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            ESTADO="Éxito"
          else
            ESTADO="Fallo"
          fi

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$SHA"
          else
            RANGE="-n 20 $SHA"
          fi

          HUS=$(git log $RANGE --format='%s%n%b' | grep -oiE 'HU-[0-9]+' | tr 'a-z' 'A-Z' | sort -u || true)

          if [ -z "$HUS" ]; then
            echo "No hay códigos HU-XX en los commits, nada que actualizar."
            exit 0
          fi

          for HU in $HUS; do
            PAGE_ID=$(jq -n --arg hu "$HU " \
              '{filter:{property:"title",title:{starts_with:$hu}}}' \
              | curl -sS --fail-with-body -X POST "https://api.notion.com/v1/databases/$NOTION_DB/query" \
                -H "Authorization: Bearer $NOTION_TOKEN" \
                -H "Notion-Version: 2022-06-28" \
                -H "Content-Type: application/json" \
                --data @- | jq -r '.results[0].id // empty')

            if [ -z "$PAGE_ID" ]; then
              echo "No encontré $HU en el tablero."
              continue
            fi

            jq -n --arg e "$ESTADO" --arg u "$RUN_URL" \
              '{properties:{"Último build":{select:{name:$e}},"Build link":{url:$u}}}' \
              | curl -sS --fail-with-body -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
                -H "Authorization: Bearer $NOTION_TOKEN" \
                -H "Notion-Version: 2022-06-28" \
                -H "Content-Type: application/json" \
                --data @- > /dev/null

            echo "Actualicé $HU con $ESTADO"
          done